---
layout: default
---
<h1>{{ page.title }}</h1>

<p>
  {{ page.date | date_to_string }}
  {% assign writer = site.authors | where: "short_name", page.author | first %}
  {% if writer %}
    — <a href="{{ writer.url | relative_url }}">{{ writer.name }}</a>
  {% else %}
    — {{ page.author }}
  {% endif %}
</p>

{{ content }}
